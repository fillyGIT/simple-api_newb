name: CI

on:
    push:
    pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create environment file
        run: cp .env.example .env

      - name: Build API image
        run: docker build -t simple-api:db-test .

      - name: Start services
        run: docker compose up -d

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -f http://127.0.0.1:9000/health; then
              exit 0
            fi
              sleep 1
          done
          exit 1

      - name: Run tests
        run: pytest

      - name: Check Python syntax
        run: python -m py_compile app.py tests/test_api.py
